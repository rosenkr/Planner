name: availability-planner
services:
  db:
    image: postgres:16
    network_mode: bridge
    environment:
      POSTGRES_DB: planner
      POSTGRES_USER: planner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - planner_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planner -d planner -h 127.0.0.1"]
      interval: 2s
      timeout: 3s
      retries: 30

  flyway:
    image: flyway/flyway:13.12.2-alpine
    network_mode: service:db
    depends_on:
      db:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://127.0.0.1:5432/planner
      FLYWAY_USER: planner
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_VALIDATE_MIGRATION_NAMING: "true"
    volumes:
      - ./src/db/migrations:/flyway/sql:ro
    command: migrate

volumes:
  planner_data:
